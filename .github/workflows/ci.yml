name: Noorak CI

on:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install flake8
      - run: flake8 engine/ lfe/ --max-line-length=200 --ignore=E501,W503,E303,E261,E722 --exclude=__pycache__

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python lfe/test_noor_pdna.py
      - run: python tests/test_engine.py
      - run: |
          python -c "import sys; sys.path.insert(0,'engine'); import noorak_search; print('OK')"
          python -c "import sys; sys.path.insert(0,'lfe'); import deepsearch; print('OK')"
          python -c "import sys; sys.path.insert(0,'lfe'); import noor_pdna; print('OK')"
